<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lobby TV - Queue Departure Board</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/security-utils.js"></script>
  <style>
    body {
      background: #020617;
      color: #f8fafc;
      overflow: hidden;
      padding: 24px;
    }
    .tv-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 2px solid #1e293b;
      margin-bottom: 24px;
    }
    .tv-title {
      font-size: 2.4rem;
      font-weight: 900;
      letter-spacing: -0.5px;
    }
    .tv-clock {
      font-size: 2rem;
      font-weight: 800;
      color: #94a3b8;
      font-family: monospace;
    }
    .tv-board {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 24px;
      height: calc(100vh - 140px);
    }
    .now-serving-col {
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 20px;
      padding: 24px;
    }
    .upcoming-col {
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 20px;
      padding: 24px;
    }
    .now-serving-card {
      background: rgba(34, 197, 94, 0.12);
      border: 2px solid #22c55e;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      animation: pulse 1.5s infinite;
    }
    .summoned-card {
      background: rgba(245, 158, 11, 0.15);
      border: 2px solid #f59e0b;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      animation: pulse 1s infinite;
    }
    .upcoming-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      border-bottom: 1px solid #1e293b;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>
  <div class="tv-header">
    <div>
      <div id="tvSalonName" class="tv-title">Salon Live Departure Board</div>
      <div style="color: #60a5fa; font-size: 1.1rem; font-weight: 600;">✨ Real-Time Waitlist & Seat Assignments</div>
    </div>
    <div id="clock" class="tv-clock">12:00:00 PM</div>
  </div>

  <div class="tv-board">
    <!-- LEFT: NOW SERVING & SUMMONED -->
    <div class="now-serving-col">
      <h2 style="font-size: 1.4rem; color: #4ade80; margin-bottom: 16px; font-weight: 800;">
        🟢 NOW SERVING & PROCEED TO CHAIR
      </h2>
      <div id="nowServingList">
        <div style="color: #64748b; font-size: 1.1rem; text-align: center; padding-top: 60px;">
          All chairs currently sanitized & awaiting next clients
        </div>
      </div>
    </div>

    <!-- RIGHT: UPCOMING WAITLIST -->
    <div class="upcoming-col">
      <h2 style="font-size: 1.4rem; color: #38bdf8; margin-bottom: 16px; font-weight: 800;">
        ⏳ NEXT IN LINE
      </h2>
      <div id="upcomingList">
        <div style="color: #64748b; font-size: 1.1rem; text-align: center; padding-top: 60px;">
          No waiting clients
        </div>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const salonSlug = urlParams.get('salon') || 'aura-salon';
    let currentSalon = null;
    let socket = null;

    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();

    function maskName(name) {
      const parts = name.trim().split(' ');
      if (parts.length === 1) return parts[0];
      return `${parts[0]} ${parts[parts.length - 1][0]}.`;
    }

    async function loadTV() {
      try {
        const res = await fetch(`/api/salons/${salonSlug}`);
        const data = await res.json();
        currentSalon = data.salon;
        document.getElementById('tvSalonName').innerText = currentSalon.name;

        await refreshTV();
        initWebSocket();
      } catch (e) {
        console.error(e);
      }
    }

    async function refreshTV() {
      if (!currentSalon) return;
      const res = await fetch(`/api/queue/active/${currentSalon.id}`);
      const data = await res.json();
      const tickets = data.tickets;

      const activeOrSummoned = tickets.filter(t => t.status === 'IN_CHAIR' || t.status === 'SUMMONED');
      const waiting = tickets.filter(t => t.status === 'WAITING' || t.status === 'SOFT_BUMPED');

      const servingContainer = document.getElementById('nowServingList');
      if (activeOrSummoned.length === 0) {
        servingContainer.innerHTML = '<div style="color: #64748b; font-size: 1.1rem; text-align: center; padding-top: 60px;">Chairs ready for next clients</div>';
      } else {
        servingContainer.innerHTML = activeOrSummoned.map(t => {
          const isSummoned = t.status === 'SUMMONED';
          const cardClass = isSummoned ? 'summoned-card' : 'now-serving-card';
          const tagText = isSummoned ? '📢 PROCEED TO CHAIR' : '✂️ SEATED';
          return `
            <div class="${cardClass}">
              <div>
                <div style="font-size: 0.9rem; font-weight: 800; letter-spacing: 1px; color: ${isSummoned ? '#f59e0b' : '#22c55e'};">${tagText}</div>
                <div style="font-size: 1.8rem; font-weight: 900; color: white;">#${escapeHtml(t.ticketNumber)} - ${escapeHtml(maskName(t.customerName))}</div>
                <div style="font-size: 1rem; color: #94a3b8;">${escapeHtml(t.serviceName)}</div>
              </div>
              <div style="text-align: right;">
                <div style="font-size: 1.1rem; font-weight: 700; color: #60a5fa;">${t.stylistId ? 'Assigned' : 'Main Chair'}</div>
              </div>
            </div>
          `;
        }).join('');
      }

      const upcomingContainer = document.getElementById('upcomingList');
      if (waiting.length === 0) {
        upcomingContainer.innerHTML = '<div style="color: #64748b; font-size: 1.1rem; text-align: center; padding-top: 60px;">No waiting clients</div>';
      } else {
        upcomingContainer.innerHTML = waiting.slice(0, 7).map((t, idx) => `
          <div class="upcoming-item">
            <div style="display: flex; align-items: center; gap: 16px;">
              <span style="font-size: 1.4rem; font-weight: 900; color: #60a5fa;">#${escapeHtml(t.ticketNumber)}</span>
              <div>
                <span style="font-weight: 700;">${escapeHtml(maskName(t.customerName))}</span>
                <div style="font-size: 0.85rem; color: var(--text-muted);">${escapeHtml(t.serviceName)}</div>
              </div>
            </div>
            <div style="font-weight: 800; color: #fb923c; font-size: 1.2rem;">
              ~${Math.max(5, t.estimatedWaitMinutes)} min
            </div>
          </div>
        `).join('');
      }
    }

    function initWebSocket() {
      const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      socket = new WebSocket(`${proto}//${window.location.host}/ws?salonId=${currentSalon.id}`);
      socket.onmessage = (e) => {
        try {
          const d = JSON.parse(e.data);
          if (d && (d.type === 'PING' || d.type === 'PONG')) {
            if (d.type === 'PING') socket.send(JSON.stringify({ type: 'PONG' }));
            return;
          }
        } catch {}
        refreshTV();
      };
      socket.onclose = () => setTimeout(initWebSocket, 3000);
    }

    loadTV();
  </script>
</body>
</html>
