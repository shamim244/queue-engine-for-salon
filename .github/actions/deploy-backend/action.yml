name: 'Deploy Backend'
description: 'Runs runner quality gate, applies zero-data-loss DB migrations, and executes rolling PM2 reloads'

inputs:
  ec2_user:
    description: 'SSH User for EC2/VPS'
    required: true
  ec2_host:
    description: 'SSH Host/IP for EC2/VPS'
    required: true
  repo_dir:
    description: 'Path to repository on VPS'
    required: false
    default: '/home/ubuntu/queue-engine-for-salon'

runs:
  using: 'composite'
  steps:
    - name: Setup Bun Runtime on Runner
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Run Backend Quality Gate Tests
      shell: bash
      run: |
        echo "🧪 Running Backend Quality Gate tests on runner..."
        bun install
        bun test apps/api/test --parallel=1 --bail
        echo "✅ Backend Quality Gate passed."

    - name: Deploy Backend to VPS
      shell: bash
      run: |
        echo "🚀 Connecting to VPS for backend deployment..."
        ssh ${{ inputs.ec2_user }}@${{ inputs.ec2_host }} "
          set -e
          cd ${{ inputs.repo_dir }}

          echo '📦 Ensuring dependencies are up to date...'
          bun install

          echo '📊 Checking database migration status...'
          bun run db:status

          echo '🚀 Applying pending database migrations...'
          if ! bun run db:migrate; then
            echo '❌ Database migration failed! Aborting deployment before reloading PM2 workers.'
            exit 1
          fi

          echo '⚡ Executing zero-downtime rolling restart for backend cluster...'
          echo '  -> Reloading worker salon-api-1 (:3001)...'
          (pm2 reload salon-api-1 --update-env || pm2 start ecosystem.config.cjs --only salon-api-1)
          curl --retry 5 --retry-delay 2 --retry-connrefused -fsS http://127.0.0.1:3001/api/health
          echo '  ✓ salon-api-1 is healthy.'

          echo '  -> Reloading worker salon-api-2 (:3002)...'
          (pm2 reload salon-api-2 --update-env || pm2 start ecosystem.config.cjs --only salon-api-2)
          curl --retry 5 --retry-delay 2 --retry-connrefused -fsS http://127.0.0.1:3002/api/health
          echo '  ✓ salon-api-2 is healthy.'

          echo '💾 Persisting PM2 state...'
          pm2 save
          echo '🎉 Backend cluster deployed successfully with zero downtime!'
        "
