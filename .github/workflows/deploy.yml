name: Production CI/CD Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Production Zero-Downtime Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # ----------------------------------------------------
      # 0. NATIVE LIGHTWEIGHT PATH FILTERING (0s Overhead)
      # ----------------------------------------------------
      - name: Detect Changed Components
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "api=true" >> $GITHUB_OUTPUT
            echo "web=true" >> $GITHUB_OUTPUT
            echo "gateway=true" >> $GITHUB_OUTPUT
            echo "Triggered via manual workflow_dispatch: deploying all components."
            exit 0
          fi

          DIFF=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "ALL")
          echo "=== Changed Files Detected ==="
          echo "$DIFF"

          if [ "$DIFF" = "ALL" ] || echo "$DIFF" | grep -qE '^(apps/api/|ecosystem\.config\.cjs|package\.json|\.github/workflows/)'; then
            echo "api=true" >> $GITHUB_OUTPUT
            echo "  ✓ API change detected"
          fi

          if [ "$DIFF" = "ALL" ] || echo "$DIFF" | grep -qE '^(apps/web/|package\.json|\.github/workflows/)'; then
            echo "web=true" >> $GITHUB_OUTPUT
            echo "  ✓ Web frontend change detected"
          fi

          if [ "$DIFF" = "ALL" ] || echo "$DIFF" | grep -qE '^(gateway/|\.github/workflows/)'; then
            echo "gateway=true" >> $GITHUB_OUTPUT
            echo "  ✓ Nginx gateway change detected"
          fi

      # ----------------------------------------------------
      # 1. QUALITY GATE: TEST BACKEND (If API changed)
      # ----------------------------------------------------
      - name: Setup Bun Runtime
        if: steps.filter.outputs.api == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run Backend Integration & Security Tests
        if: steps.filter.outputs.api == 'true'
        run: |
          bun install
          bun test apps/api/test --bail

      # ----------------------------------------------------
      # 2. CONFIGURE SSH (Only once per pipeline)
      # ----------------------------------------------------
      - name: Configure SSH Key
        if: steps.filter.outputs.api == 'true' || steps.filter.outputs.web == 'true' || steps.filter.outputs.gateway == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add Server Host to Known Hosts
        if: steps.filter.outputs.api == 'true' || steps.filter.outputs.web == 'true' || steps.filter.outputs.gateway == 'true'
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # ----------------------------------------------------
      # 3. SYNC & RELOAD NGINX GATEWAYS (If gateway changed)
      # ----------------------------------------------------
      - name: Sync & Reload Nginx Gateway
        if: steps.filter.outputs.gateway == 'true'
        run: |
          rsync -avz gateway/ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/salon/gateway/
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            sudo cp /home/ubuntu/salon/gateway/salon-backend-gateway.conf /etc/nginx/sites-available/salon-backend-gateway && \
            sudo cp /home/ubuntu/salon/gateway/salon-frontend-gateway.conf /etc/nginx/sites-available/salon-frontend-gateway && \
            sudo nginx -t && \
            sudo systemctl reload nginx
          "

      # ----------------------------------------------------
      # 4. DEPLOY BACKEND CLUSTER (Zero-Downtime Rolling)
      # ----------------------------------------------------
      - name: Deploy Backend Cluster (Zero-Downtime)
        if: steps.filter.outputs.api == 'true'
        run: |
          rsync -avz --delete \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='dist' \
            apps/api/ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/salon/backend/
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            cd /home/ubuntu/salon/backend && \
            bun install && \
            echo '⚡ Reloading worker salon-api-1...' && \
            pm2 reload salon-api-1 --update-env && \
            curl --retry 10 --retry-delay 2 --retry-connrefused -sf http://127.0.0.1:3001/api/health && \
            echo '⚡ Reloading worker salon-api-2...' && \
            pm2 reload salon-api-2 --update-env && \
            curl --retry 10 --retry-delay 2 --retry-connrefused -sf http://127.0.0.1:3002/api/health && \
            pm2 save
          "

      # ----------------------------------------------------
      # 5. DEPLOY FRONTEND WEB APPLICATION (Next.js & PM2)
      # ----------------------------------------------------
      - name: Deploy Frontend Web Application
        if: steps.filter.outputs.web == 'true'
        run: |
          rsync -avz --delete \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.git' \
            apps/web/ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/salon/frontend/
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            cd /home/ubuntu/salon/frontend && \
            bun install && \
            bun run build && \
            pm2 reload salon-frontend --update-env && \
            pm2 save
          "

      # ----------------------------------------------------
      # 6. VALIDATE LIVE PUBLIC ENDPOINTS
      # ----------------------------------------------------
      - name: Validate Live Public Endpoints
        run: |
          curl --retry 5 --retry-delay 2 --retry-connrefused -f -s -i http://${{ secrets.EC2_HOST }}:8000/api/health
          curl --retry 5 --retry-delay 2 --retry-connrefused -f -s -I http://${{ secrets.EC2_HOST }}
