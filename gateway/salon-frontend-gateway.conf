# ==============================================================================
# SALON FRONTEND MULTI-SERVER GATEWAY & LOAD BALANCER
# ==============================================================================
# Architecture:
# - Entry Point: EC2 Nginx Port 80
# - Load Balancing: least_conn (dynamic traffic distribution across active pool)
# - Failover: Automatic zero-downtime rerouting if any node drops or crashes
# - Scalability: Add Server 1, Server 2, Server 3, Server 4...
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. UPSTREAM FRONTEND CLUSTER POOL
# ------------------------------------------------------------------------------
upstream salon_frontend_cluster {
    # Distribute traffic based on lowest active connections (prevents node overload)
    least_conn;

    # [Node 1] Local EC2 Next.js Server (:3000)
    server 127.0.0.1:3000 max_fails=2 fail_timeout=10s;

    # [Node 2] External Server 1 (web.nexgentech.site via Bridge :3005)
    server 127.0.0.1:3005 max_fails=2 fail_timeout=10s;

    # [Node 3] External Server 2 (Template: uncomment to activate)
    # server 127.0.0.1:3006 max_fails=2 fail_timeout=10s;

    # [Node 4] External Server 3 (Template: uncomment to activate)
    # server 127.0.0.1:3007 max_fails=2 fail_timeout=10s;

    # Keep connections warm to eliminate TCP handshake latency
    keepalive 64;
}

# ------------------------------------------------------------------------------
# 2. MAIN PUBLIC GATEWAY (Port 80)
# ------------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Native Gzip Compression for all frontend assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # --------------------------------------------------------------------------
    # Central API Route -> Local EC2 Elysia Cluster (:8000) & Redis
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # Central WebSockets -> Local EC2 Redis Pub/Sub (:8000)
    # --------------------------------------------------------------------------
    location /ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # Frontend Pages & Assets -> Distributed Multi-Server Cluster
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://salon_frontend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Instant Automatic Failover:
        # If any server in the cluster gives an error, timeout, or 502,
        # Nginx silently and immediately routes the request to another healthy server!
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 5s;
    }
}

# ------------------------------------------------------------------------------
# 3. INTERNAL SSL BRIDGES FOR CLOUDFLARE-TUNNELED SERVERS
# ------------------------------------------------------------------------------
# These bridges negotiate HTTPS TLS 1.3 & SNI with Cloudflare so that
# Cloudflare never blocks requests with Error 1003.

# Bridge for External Server 1 (web.nexgentech.site)
server {
    listen 127.0.0.1:3005;
    server_name _;

    location / {
        proxy_pass https://web.nexgentech.site;
        proxy_ssl_server_name on;
        proxy_ssl_name web.nexgentech.site;
        proxy_set_header Host web.nexgentech.site;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

