map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream salon_frontend_cluster {
    least_conn; # Distribute web traffic across least busy frontend instances
    include /etc/nginx/conf.d/salon-frontend-nodes.inc;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Maximum file upload size (logos, banners, receipts, QR codes)
    client_max_body_size 16M;

    # Gzip Response Compression (>1KB) - GEMINI.md Core Mandate
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Defensive Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Real IP Resolution: Cloudflare CF-Connecting-IP with fallback to remote_addr
    set $client_ip $remote_addr;
    if ($http_cf_connecting_ip != "") {
        set $client_ip $http_cf_connecting_ip;
    }

    # Protocol Resolution: Preserve Cloudflare HTTPS scheme
    set $forwarded_proto $scheme;
    if ($http_x_forwarded_proto != "") {
        set $forwarded_proto $http_x_forwarded_proto;
    }

    # Optional Server-Specific SSL Hook (e.g. Let's Encrypt or Cloudflare Origin CA)
    include /etc/nginx/conf.d/salon-ssl.inc*;

    # 1. Next.js Static Asset Bundles (Immutable 1-Year Cache) - GEMINI.md Core Mandate
    location /_next/static/ {
        proxy_pass http://salon_frontend_cluster;
        proxy_http_version 1.1;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 5s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 2. Next.js Web Application & Dynamic Routes
    location / {
        proxy_pass http://salon_frontend_cluster;
        proxy_http_version 1.1;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 5s;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
