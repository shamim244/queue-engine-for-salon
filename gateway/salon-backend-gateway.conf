upstream salon_backend_cluster {
    least_conn; # Distribute incoming requests to the least busy worker
    include /etc/nginx/conf.d/salon-backend-nodes.inc;
    keepalive 64;
}

server {
    listen 8000;
    listen [::]:8000;
    server_name _;

    # Maximum file upload size
    client_max_body_size 16M;

    # Gzip Response Compression (>1KB) - GEMINI.md Core Mandate
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Defensive Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Real IP Resolution: Cloudflare CF-Connecting-IP with fallback to remote_addr
    set $client_ip $remote_addr;
    if ($http_cf_connecting_ip != "") {
        set $client_ip $http_cf_connecting_ip;
    }

    # Protocol Resolution: Preserve Cloudflare HTTPS scheme
    set $forwarded_proto $scheme;
    if ($http_x_forwarded_proto != "") {
        set $forwarded_proto $http_x_forwarded_proto;
    }

    location / {
        proxy_pass http://salon_backend_cluster;
        proxy_http_version 1.1;

        # Failover protection: If a worker is stopped, immediately route to active workers
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 5s;

        # WebSocket upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard & Cloudflare Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # Keep persistent WebSocket connections open
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
