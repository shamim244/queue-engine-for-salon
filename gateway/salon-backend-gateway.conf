upstream salon_backend_cluster {
    least_conn; # Distribute incoming requests to the least busy worker
    include /etc/nginx/conf.d/salon-backend-nodes.conf;
    keepalive 64;
}

server {
    listen 8000;
    listen [::]:8000;
    server_name _;

    location / {
        proxy_pass http://salon_backend_cluster;
        proxy_http_version 1.1;

        # WebSocket upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep persistent WebSocket connections open
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
